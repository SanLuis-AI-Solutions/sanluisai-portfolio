<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A3160;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0F1F3D;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#D9A434;stop-opacity:0" />
      <stop offset="15%" style="stop-color:#D9A434;stop-opacity:0.6" />
      <stop offset="85%" style="stop-color:#D9A434;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#D9A434;stop-opacity:0" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <!-- Subtle geometric accent lines -->
  <line x1="0" y1="200" x2="1200" y2="200" stroke="rgba(217,164,52,0.06)" stroke-width="1"/>
  <line x1="0" y1="430" x2="1200" y2="430" stroke="rgba(217,164,52,0.06)" stroke-width="1"/>
  <line x1="900" y1="0" x2="900" y2="630" stroke="rgba(217,164,52,0.04)" stroke-width="1"/>
  <!-- Gold thread accent -->
  <line x1="60" y1="100" x2="400" y2="100" stroke="#D9A434" stroke-width="2" opacity="0.8"/>
  <!-- Main heading -->
  <text x="60" y="210" font-family="'Cormorant Garamond', 'Georgia', serif" font-size="58" font-weight="600" fill="#D9A434" letter-spacing="0.02">Custom AI Solutions</text>
  <!-- Subtitle -->
  <text x="60" y="275" font-family="'Inter', 'Helvetica', sans-serif" font-size="26" font-weight="400" fill="#FAF7F1" letter-spacing="0.04">Built for Houston. Built to Work.</text>
  <!-- Description -->
  <text x="60" y="340" font-family="'Inter', 'Helvetica', sans-serif" font-size="18" font-weight="300" fill="rgba(250,247,241,0.7)" letter-spacing="0.02">
    <tspan x="60" dy="0">No-code AI systems, automations, and custom</tspan>
    <tspan x="60" dy="28">applications for small and mid-size businesses.</tspan>
  </text>
  <!-- Gold thread bottom -->
  <line x1="60" y1="530" x2="600" y2="530" stroke="url(#lineGrad)" stroke-width="2"/>
  <!-- CTA accent -->
  <rect x="60" y="420" width="200" height="44" rx="4" fill="#D9A434"/>
  <text x="160" y="447" font-family="'Inter', 'Helvetica', sans-serif" font-size="16" font-weight="600" fill="#1A3160" text-anchor="middle" letter-spacing="0.04">$300 Discovery Session</text>
  <!-- SanLuis flame mark -->
  <text x="1080" y="570" font-family="'Cormorant Garamond', 'Georgia', serif" font-size="48" font-weight="300" fill="#D9A434" text-anchor="end" letter-spacing="0.08">SL</text>
  <text x="1140" y="570" font-family="'Inter', 'Helvetica', sans-serif" font-size="12" font-weight="300" fill="rgba(217,164,52,0.5)" text-anchor="end">SANLUIS AI</text>
</svg>