<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background: Atlantic Navy -->
  <rect width="1200" height="630" fill="#1A3160"/>
  
  <!-- Darker navy diagonal sweep -->
  <path d="M0 0 L1200 0 L1200 630 L0 630 Z" fill="#0F1F3D" opacity="0.3"/>
  <path d="M-100 630 L400 -100 L450 -100 L-50 630 Z" fill="#D9A434" opacity="0.04"/>
  
  <!-- Gold accent line - top -->
  <rect x="60" y="160" width="80" height="2" fill="#D9A434"/>
  
  <!-- Flame mark icon - simple minimal -->
  <g transform="translate(60, 180)" fill="none" stroke="#D9A434" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 4C12 4 8 10 8 14C8 17.3 10.7 20 14 20C17.3 20 20 17.3 20 14C20 10 16 4 14 2C13.3 3 12 4 12 4Z"/>
  </g>
  
  <!-- Diamond accent -->
  <rect x="60" y="220" width="8" height="8" fill="#D9A434" transform="rotate(45, 64, 224)"/>
  
  <!-- Main title -->
  <text x="60" y="290" font-family="Georgia, 'Times New Roman', serif" font-size="52" font-weight="500" fill="#FAF7F1" letter-spacing="-0.02">SanLuis AI Solutions</text>
  
  <!-- Subtitle -->
  <text x="60" y="340" font-family="'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="300" fill="#FAF7F1" opacity="0.7" letter-spacing="0.02">Your business, running on AI.</text>
  
  <!-- Gold thread accent - bottom -->
  <rect x="60" y="380" width="120" height="1" fill="#D9A434" opacity="0.6"/>
  
  <!-- Tagline -->
  <text x="60" y="410" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#FAF7F1" opacity="0.4" letter-spacing="0.08" text-transform="uppercase">Houston &middot; No-code AI &middot; Bilingual EN/ES</text>
  
  <!-- Gold ornament - bottom right area -->
  <g transform="translate(1060, 380)" fill="none" stroke="#D9A434" stroke-width="1" opacity="0.15">
    <rect x="0" y="0" width="80" height="80" rx="2"/>
    <rect x="10" y="10" width="60" height="60" rx="1"/>
    <rect x="20" y="20" width="40" height="40" rx="1"/>
  </g>
  
  <!-- Vertical gold accent - right side -->
  <rect x="1140" y="0" width="1" height="630" fill="#D9A434" opacity="0.06"/>
  
  <!-- Stats strip - bottom -->
  <g transform="translate(60, 480)">
    <text x="0" y="0" font-family="Georgia, serif" font-size="28" font-weight="500" fill="#D9A434">3 wk</text>
    <text x="0" y="20" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#FAF7F1" opacity="0.35" letter-spacing="0.08" text-transform="uppercase">Avg Delivery</text>
    
    <line x1="100" y1="-8" x2="100" y2="24" stroke="#FAF7F1" stroke-width="0.5" opacity="0.08"/>
    
    <text x="120" y="0" font-family="Georgia, serif" font-size="28" font-weight="500" fill="#D9A434">60%</text>
    <text x="120" y="20" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#FAF7F1" opacity="0.35" letter-spacing="0.08" text-transform="uppercase">Faster Quoting</text>
    
    <line x1="220" y1="-8" x2="220" y2="24" stroke="#FAF7F1" stroke-width="0.5" opacity="0.08"/>
    
    <text x="240" y="0" font-family="Georgia, serif" font-size="28" font-weight="500" fill="#D9A434">$300</text>
    <text x="240" y="20" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#FAF7F1" opacity="0.35" letter-spacing="0.08" text-transform="uppercase">Start Here</text>
  </g>
</svg>
