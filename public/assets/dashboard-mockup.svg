<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" fill="none">
  <rect width="800" height="400" rx="8" fill="#FAF7F1"/>
  
  <!-- Header -->
  <rect x="0" y="0" width="800" height="48" rx="8" fill="#1A3160"/>
  <rect x="0" y="32" width="800" height="16" fill="#1A3160"/>
  <circle cx="20" cy="24" r="6" fill="#D9A434"/>
  <rect x="36" y="20" width="60" height="8" rx="4" fill="#FAF7F1" opacity="0.3"/>
  <rect x="650" y="18" width="120" height="12" rx="4" fill="#FAF7F1" opacity="0.15"/>
  
  <!-- "Your System" label -->
  <rect x="320" y="64" width="160" height="28" rx="4" fill="#1A3160"/>
  <text x="400" y="83" textAnchor="middle" fill="#FAF7F1" fontFamily="Inter, sans-serif" fontSize="13" fontWeight="600">Your AI Dashboard</text>
  
  <!-- Stats row -->
  <rect x="40" y="104" width="160" height="80" rx="4" fill="#FFFFFF" stroke="#E8E2D4" strokeWidth="1"/>
  <text x="120" y="130" textAnchor="middle" fill="#D9A434" fontFamily="Cormorant Garamond, serif" fontSize="28" fontWeight="600">$38.7K</text>
  <text x="120" y="150" textAnchor="middle" fill="#4D5663" fontFamily="Inter, sans-serif" fontSize="9" opacity="0.6">ANNUAL SAVINGS</text>
  <text x="120" y="175" textAnchor="middle" fill="#1A3160" fontFamily="Inter, sans-serif" fontSize="8" opacity="0.4">vs. before automation</text>

  <rect x="220" y="104" width="160" height="80" rx="4" fill="#FFFFFF" stroke="#E8E2D4" strokeWidth="1"/>
  <text x="300" y="130" textAnchor="middle" fill="#D9A434" fontFamily="Cormorant Garamond, serif" fontSize="28" fontWeight="600">5.2</text>
  <text x="300" y="150" textAnchor="middle" fill="#4D5663" fontFamily="Inter, sans-serif" fontSize="9" opacity="0.6">HOURS / WEEK</text>
  <text x="300" y="175" textAnchor="middle" fill="#1A3160" fontFamily="Inter, sans-serif" fontSize="8" opacity="0.4">recovered from paperwork</text>

  <rect x="400" y="104" width="160" height="80" rx="4" fill="#FFFFFF" stroke="#E8E2D4" strokeWidth="1"/>
  <text x="480" y="130" textAnchor="middle" fill="#D9A434" fontFamily="Cormorant Garamond, serif" fontSize="28" fontWeight="600">97%</text>
  <text x="480" y="150" textAnchor="middle" fill="#4D5663" fontFamily="Inter, sans-serif" fontSize="9" opacity="0.6">ACCURACY</text>
  <text x="480" y="175" textAnchor="middle" fill="#1A3160" fontFamily="Inter, sans-serif" fontSize="8" opacity="0.4">automated task accuracy</text>

  <rect x="580" y="104" width="180" height="80" rx="4" fill="#FFFFFF" stroke="#E8E2D4" strokeWidth="1"/>
  <div>
    <text x="650" y="130" textAnchor="middle" fill="#D9A434" fontFamily="Cormorant Garamond, serif" fontSize="14" fontWeight="600">REAL-TIME</text>
    <text x="650" y="145" textAnchor="middle" fill="#4D5663" fontFamily="Inter, sans-serif" fontSize="9" opacity="0.6">SYNC STATUS</text>
    <circle cx="620" cy="136" r="4" fill="#22C55E"/>
    <text x="630" y="139" fill="#22C55E" fontFamily="Inter, sans-serif" fontSize="8">All systems online</text>
    <text x="620" y="175" fill="#1A3160" fontFamily="Inter, sans-serif" fontSize="8" opacity="0.4">Last sync: 2 min ago</text>
  </div>

  <!-- Divider -->
  <line x1="40" y1="200" x2="760" y2="200" stroke="#D9A434" strokeWidth="0.5" opacity="0.3"/>

  <!-- Title -->
  <text x="400" y="226" textAnchor="middle" fill="#1A3160" fontFamily="Inter, sans-serif" fontSize="11" fontWeight="600" opacity="0.6">RECENT ACTIVITY</text>

  <!-- Activity rows -->
  <rect x="40" y="240" width="720" height="36" rx="4" fill="#FFFFFF" stroke="#E8E2D4" strokeWidth="1"/>
  <text x="60" y="263" fill="#1A3160" fontFamily="Inter, sans-serif" fontSize="11">Quote generated for Garza International — commercial buildout, Houston TX</text>
  <text x="680" y="263" fill="#4D5663" fontFamily="Inter, sans-serif" fontSize="9" opacity="0.5">2m ago</text>
  <circle cx="46" cy="258" r="3" fill="#D9A434"/>

  <rect x="40" y="282" width="720" height="36" rx="4" fill="#FFFFFF" stroke="#E8E2D4" strokeWidth="1"/>
  <text x="60" y="305" fill="#1A3160" fontFamily="Inter, sans-serif" fontSize="11">Lead captured from website — Susie's Jewelry Repair, service inquiry</text>
  <text x="680" y="305" fill="#4D5663" fontFamily="Inter, sans-serif" fontSize="9" opacity="0.5">12m ago</text>
  <circle cx="46" cy="300" r="3" fill="#D9A434"/>

  <rect x="40" y="324" width="720" height="36" rx="4" fill="#FFFFFF" stroke="#E8E2D4" strokeWidth="1"/>
  <text x="60" y="347" fill="#1A3160" fontFamily="Inter, sans-serif" fontSize="11">Inventory alert — reorder point hit for steel beams, Project Delta</text>
  <text x="680" y="347" fill="#4D5663" fontFamily="Inter, sans-serif" fontSize="9" opacity="0.5">45m ago</text>
  <circle cx="46" cy="342" r="3" fill="#D9A434"/>

  <!-- Bottom status bar -->
  <rect x="0" y="380" width="800" height="20" rx="0" fill="#1A3160" opacity="0.08"/>
  <text x="40" y="394" fill="#1A3160" fontFamily="Inter, sans-serif" fontSize="9" opacity="0.4">Powered by SanLuis AI · 100+ automations active today</text>
</svg>
